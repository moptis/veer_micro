# Full-record 2x2 mode experiment on tile wsw_rough, NLCD-forced WRF winds.
#
#   sbatch scripts/run_modes_year.sh          # 4-task array, one per cell
#   sbatch scripts/wrg_modes_year.sh          # then 4 WRG exports
#
# Generated by a loop over dem_mode x roughness_mode -- do not hand-edit one
# without the others, the whole point is that they differ in exactly two lines.
# The 240-timestep validate run (configs/wsw_nlcdwrf_modes_r-*.yaml) picked
# dem_mode=recentered, roughness_mode=absolute; this runs all four over the
# entire record so the choice can be seen in a WRG rather than a single RMSE.
#
# NOTE the record is 52560 x 10 min = 365 days of data, but it is NOT one
# calendar year: it is ~12 month-long chunks stitched from scattered years
# (2002-2021), assembled as a representative annual cycle. Fine for a wind
# resource summary; do not read it as a specific year's climate.
#
# Only the 100 m level is written -- that is an EXACT model output height (see
# constants.OUTPUT_HEIGHTS), and it is all the WRG export needs at a 100 m hub.
# Writing all 27 levels would multiply the store by 27 for no benefit here.

name: wsw_nlcdwrf_year_drec_rabs

source:
  kind: h5
  path: /scratch/moptis/c2wind/wsw_nlcd/processed/wsw_nlcd.h5

time:
  start: null
  end: null
  stride: 1          # every 10-min step
  limit: null        # all 52560

tiling:
  mode: sites
  working_crs: auto
  sites:
    - {id: wsw_rough, lon: -105.4617, lat: 34.4757}

terrain:
  dem_mode: recentered
  roughness_mode: absolute
  landcover_source: nlcd
  cache_root: /scratch/moptis/fuxicfd/cache

model:
  assets_root: /scratch/moptis/fuxicfd/assets
  device: auto
  batch_size: 8
  read_block: 822

output:
  path: /scratch/moptis/fuxicfd/out/wsw_nlcdwrf_year_drec_rabs.zarr
  dtype: float16
  variables: [u, v]
  levels: [100.0]
  time_chunk: 144    # one day per chunk, suits the WRG time-block reads
  mosaic: false
