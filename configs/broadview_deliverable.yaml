# Deliverable run: full domain, hub heights matching the existing coarse WRGs.
#
# The coarse 1-km deliverables at
#   /scratch/moptis/c2wind/broadview/control/deliverables/wrg/broadview
# are at exactly 80/100/120/160 m, so these are too -- which means every level
# here is INTERPOLATED, since FuXi-CFD's stack has no round numbers above 50 m
# (75.5255, 83.57805, 92.435855, 102.17944, 112.897385, 124.687123, 137.655835,
# 151.921419, 167.613561 ...). See levels.py; the run log prints the weights used.
#
#   python scripts/sizing.py configs/broadview_deliverable.yaml
#   sbatch --array=0-31 scripts/submit_inference.sh configs/broadview_deliverable.yaml
#   sbatch scripts/make_wrgs.sh

name: broadview_deliverable

source:
  kind: h5
  path: /scratch/moptis/c2wind/broadview/control/processed/broadview/control.h5

time:
  start: null
  end: null
  stride: 1          # full 10-min cadence; all 52560 steps
  limit: null

tiling:
  mode: domain
  stride_m: 6000     # 3 km overlap for blending
  max_tiles: null

terrain:
  dem_mode: recentered
  roughness_mode: absolute
  cache_root: /scratch/moptis/fuxicfd/cache

model:
  assets_root: /scratch/moptis/fuxicfd/assets
  device: auto
  batch_size: 8

output:
  path: /scratch/moptis/fuxicfd/out/broadview_deliverable.zarr
  dtype: float16
  # u and v are all a WRG needs; w and k would triple the store for nothing.
  # Add them back if you also want turbulence/vertical-velocity analysis.
  variables: [u, v]
  levels: [80.0, 100.0, 120.0, 160.0]
  time_chunk: 6
  mosaic: false      # tile store; the WRG exporter blends tiles on the fly
