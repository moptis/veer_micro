# WSW box domain -- dem_mode=recentered / roughness_mode=absolute, rerun with the
# WRF-derived z0 table.
#
# Same geometry, source and modes as wsw_box2x2_drec_rabs.yaml. The only change is
# in the code: terrain/roughness.py NLCD_Z0 now comes from WRF's VEGPARM.TBL
# instead of UL's table, so the static channel and the winds driving the model
# describe the same surface. Evergreen forest drops 1.125 -> 0.500 m and
# shrub/scrub 0.10 -> 0.03, which cuts the shrub->forest contrast the model sees
# from 5.1 to 2.3 sigma -- the excessive sensitivity at forested sites was the
# reason for the change.
#
# Written to its own store so the UL-table run stays available for A/B. The static
# terrain cache is keyed by a hash of the table values, so nothing stale is reused.
#
# Purpose: validate dem_mode x roughness_mode against site observations. The
# single-tile experiment (configs/wsw_nlcdwrf_year_*.yaml) could only be scored
# on tile-mean vertical profiles against WRF, which is blind to the horizontal
# pattern -- and the modes differ pointwise by up to ~1 m/s in Weibull A, 10-15%
# of points past 0.25 m/s for pairs differing in dem_mode. Observations are the
# only thing that can arbitrate that, and the test tile had none.
#
# Differs from wsw_box_nlcd.yaml in three ways:
#   * source is the NLCD-forced WRF run, not the MODIS-forced control
#   * min_lat raised 33.8 -> 34.25; the original box put its southern half
#     outside the WRF domain and failed the coverage guard at 46%
#   * dem_mode/roughness_mode vary across the four generated files
#
# Generated by a loop -- do not hand-edit one without the others.

name: wsw_box_wrfz0_drec_rabs

source:
  kind: h5
  path: /scratch/moptis/c2wind/wsw_nlcd/processed/wsw_nlcd.h5

time:
  start: null
  end: null
  stride: 1
  limit: null

tiling:
  mode: domain
  working_crs: auto
  stride_m: 6000     # 3 km overlap
  max_tiles: null
  bbox:
     min_lon: -105.57
     min_lat:   34.25
     max_lon: -105.3
     max_lat:   34.48

terrain:
  dem_mode: recentered
  roughness_mode: absolute
  landcover_source: nlcd
  cache_root: /scratch/moptis/fuxicfd/cache

model:
  assets_root: /scratch/moptis/fuxicfd/assets
  device: auto
  batch_size: 8
  read_block: 822

output:
  path: /scratch/moptis/fuxicfd/out/wsw_box_wrfz0_drec_rabs.zarr
  dtype: float16
  variables: [u, v]
  levels: [80.0, 100.0, 120.0, 160.0]
  time_chunk: 24
  mosaic: false
