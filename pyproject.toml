[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuxicfd-wrf"
version = "0.1.0"
description = "Drive the pre-trained FuXi-CFD model with WRF output to produce 30 m 3D wind fields"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "pandas>=2.0",
    "xarray>=2023.1",
    "zarr>=2.14",
    "pyproj>=3.5",
    "rasterio>=1.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]
cpu = ["onnxruntime>=1.17"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[project.scripts]
fuxicfd-wrf = "fuxicfd_wrf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: spawns real subprocesses"]
